name: Build and Release FnNAS

on:
  workflow_dispatch:
    inputs:
      DEVICE:
        description: "构建指定设备（留空则构建所有 uboot/* 设备）"
        required: false
        default: ""
      ROOT_SIZE:
        description: "rootfs 扩容大小（GiB，默认 6）"
        required: false
        default: "6"
      BASE_IMAGE_URL:
        description: "自定义 fnNAS 基础包下载链接（支持 .img / .img.gz / .img.xz），留空则使用默认最新 Rockchip 镜像"
        required: false
        default: ""
      BASE_IMAGE_FILENAME:
        description: "自定义基础包下载后的本地文件名（需带 .img / .img.gz / .img.xz 后缀），用于链接本身无后缀或后缀错误时；留空则自动从链接取名。仅当 BASE_IMAGE_URL 填写时生效"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare device matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      tag: ${{ steps.set-tag.outputs.tag }}
      all_devices: ${{ steps.all-devices.outputs.all_devices }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate release tag
        id: set-tag
        run: |
          echo "tag=fnos_$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Generate device matrix
        id: set-matrix
        run: |
          set -e
          INPUT_DEVICE="${{ github.event.inputs.DEVICE }}"
          ALL_DEVICES=$(find uboot -mindepth 2 -maxdepth 2 -type d | sed 's|^uboot/||' | sort)
          if [ -n "$INPUT_DEVICE" ]; then
            INPUT_LOWER=$(echo "$INPUT_DEVICE" | tr '[:upper:]' '[:lower:]')
            MATCH=$(echo "$ALL_DEVICES" | awk -v target="$INPUT_LOWER" '
              { orig=$0; lower=tolower(orig); split(orig, parts, "/"); leaf=tolower(parts[length(parts)]); }
              lower==target { print orig; exit }
              leaf==target { candidate=orig }
              END { if (candidate) print candidate }
            ')
            if [ -z "$MATCH" ]; then
              echo "❌ Device not found: $INPUT_DEVICE"
              exit 1
            fi
            DEVICES=$(printf '["%s"]' "$MATCH")
          else
            DEVICES=$(printf "%s\n" "$ALL_DEVICES" | jq -R -s -c 'split("\n")[:-1]')
          fi
          echo "matrix={\"device\":$DEVICES}" >> "$GITHUB_OUTPUT"

      - name: List all devices for release
        id: all-devices
        run: |
          ALL_DEVICES=$(find uboot -mindepth 2 -maxdepth 2 -type d | sed 's|^uboot/||' | sort | tr '\n' ',' | sed 's/,$//')
          echo "all_devices=$ALL_DEVICES" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.device }}
    needs: prepare
    runs-on: ubuntu-latest
    continue-on-error: true       # 单设备失败不影响其他设备
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq xz-utils wget

      - name: Download Latest Rockchip FnNAS Image
        id: download
        run: |
          set -e
          CUSTOM_URL="${{ github.event.inputs.BASE_IMAGE_URL }}"
          CUSTOM_NAME="${{ github.event.inputs.BASE_IMAGE_FILENAME }}"
          if [ -z "$CUSTOM_URL" ]; then
            REPO="ophub/fnnas"
            TAG="fnnas_base_image"
            API_URL="https://api.github.com/repos/$REPO/releases/tags/$TAG"
            RESPONSE=$(curl -sL "$API_URL")
            ASSET_URL=$(echo "$RESPONSE" | jq -r '
              .assets[] | select(.name | test("rockchip") and endswith(".img.xz")) | .browser_download_url
            ' | sort -V | tail -n 1)
            if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
              echo "❌ No Rockchip .img.xz asset found"
              exit 1
            fi
            FILENAME=$(basename "$ASSET_URL")
            curl -L -o "$FILENAME" "$ASSET_URL"
          else
            if [ -n "$CUSTOM_NAME" ]; then
              FILENAME="$CUSTOM_NAME"
            else
              FILENAME=$(basename "$CUSTOM_URL" | cut -d'?' -f1)
              if [ -z "$FILENAME" ]; then
                echo "❌ 无法从链接中获取文件名，请在 BASE_IMAGE_FILENAME 中手动指定"
                exit 1
              fi
            fi
            case "$FILENAME" in
              *.img|*.img.gz|*.img.xz)
                ;;
              *)
                echo "❌ 镜像文件名后缀无法识别: '$FILENAME'（支持 .img / .img.gz / .img.xz）"
                echo "   请在 BASE_IMAGE_FILENAME 中手动指定带正确后缀的文件名"
                exit 1
                ;;
            esac
            wget -O "$FILENAME" "$CUSTOM_URL"
          fi
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"

      - name: Decompress base image
        run: |
          set -e
          mkdir -p fnnas-arm64
          FILENAME="${{ steps.download.outputs.filename }}"
          case "$FILENAME" in
            *.img.xz)
              xz -d -c "$FILENAME" > fnnas-arm64/fnnas-arm64.img
              ;;
            *.img.gz)
              gzip -d -c "$FILENAME" > fnnas-arm64/fnnas-arm64.img
              ;;
            *.img)
              cp "$FILENAME" fnnas-arm64/fnnas-arm64.img
              ;;
            *)
              echo "❌ 不支持的镜像后缀: $FILENAME (仅支持 .img / .img.gz / .img.xz)"
              exit 1
              ;;
          esac

      - name: Build device image
        id: build
        run: |
          DEVICE_PATH="${{ matrix.device }}"
          export DEVICE=$(basename "$DEVICE_PATH")
          export ROOT_SIZE="${{ github.event.inputs.ROOT_SIZE }}"
          echo "device_name=$DEVICE" >> "$GITHUB_OUTPUT"
          mkdir -p build-logs
          bash buildfnos.sh &> "build-logs/${DEVICE}.log" || (
            cat "build-logs/${DEVICE}.log"
            exit 1
          )

      - name: Upload private build logs
        uses: actions/upload-artifact@v4
        with:
          name: private-build-logs-${{ steps.build.outputs.device_name }}-${{ github.run_number }}
          path: build-logs/

      - name: Compress built image
        run: |
          mkdir -p out-compressed
          for f in out/*.img; do
            xz -T0 -z -9 -c "$f" > "out-compressed/$(basename "$f").xz"
          done

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: out-compressed/*.img.xz
          body: |
            🎉 基于 FNOS ARM 镜像二次打包
            根目录默认大小: ${{ github.event.inputs.ROOT_SIZE }} GiB
            基础包来源: ${{ github.event.inputs.BASE_IMAGE_URL != '' && '自定义链接' || 'ophub/fnnas 默认最新 Rockchip 镜像' }}
            支持设备: ${{ needs.prepare.outputs.all_devices }}
          
            🎉 FNOS ARM re-packaged image
            Default root size: ${{ github.event.inputs.ROOT_SIZE }} GiB
            Base image source: ${{ github.event.inputs.BASE_IMAGE_URL != '' && 'Custom URL' || 'ophub/fnnas default latest Rockchip image' }}
            Supported devices: ${{ needs.prepare.outputs.all_devices }}
